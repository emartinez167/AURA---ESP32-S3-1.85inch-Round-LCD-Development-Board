                                    - if:
                                        condition:
                                          lambda: return id(${display_emotion_mode_id}) == 2;
                                        then:
                                          - lvgl.image.update:
                                              id: aura_main_image
                                              src: aura_blink_half_closed_img
                                    - if:
                                        condition:
                                          lambda: return id(${display_emotion_mode_id}) == 3;
                                        then:
                                          - lvgl.image.update:
                                              id: aura_main_image
                                              src: aura_face_down_img
                                    - if:
                                        condition:
                                          lambda: return id(${display_emotion_mode_id}) == 4;
