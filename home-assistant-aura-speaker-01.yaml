              - label:
                  id: aura_boot_progress_label
                  x: 0
                  y: 281
                  width: 360
                  text: "0%"
                  text_align: CENTER
                  text_font: montserrat_12
                  text_color: 0xCBD5E1
                  bg_opa: TRANSP
