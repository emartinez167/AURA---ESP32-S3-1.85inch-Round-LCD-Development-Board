# ======================================================
# SENSORS
# ======================================================
select:
  - platform: template
    name: "Display - Emotion"
    id: ${emotion_select_id}
    optimistic: true
    restore_value: true
    options:
      - "Auto"
      - "Happy"
      - "Sleepy"
      - "Sad"
      - "Angry"
      - "Surprised"
    initial_option: "Auto"
    set_action:
      - lambda: |-
          if      (x == "Happy")      id(${display_emotion_mode_id}) = 1;
          else if (x == "Sleepy")     id(${display_emotion_mode_id}) = 2;
          else if (x == "Sad")        id(${display_emotion_mode_id}) = 3;
          else if (x == "Angry")      id(${display_emotion_mode_id}) = 4;
          else if (x == "Surprised")  id(${display_emotion_mode_id}) = 5;
          else                         id(${display_emotion_mode_id}) = 0;
          id(${display_awake_until_id}) = millis() + 300000UL;
      - script.execute: aura_apply_phase
  - platform: template
    name: "WakeWord - Sensitivity"
    optimistic: true
    initial_option: "Medium"
    restore_value: true
    entity_category: config
    options:
      - "Low sensitivity"
      - "Medium"
      # Added August 2026: Medium (176) and High (50) left a big gap with
      # no real middle ground - Medium missed genuine wake words, High
      # picked up ambient noise as false triggers. This sits roughly
      # halfway between them as an actual intermediate option.
      - "Medium-High sensitivity"
      - "High sensitivity"
    on_value:
      lambda: |-
        if (x == "Low sensitivity") {
          id(${wake_word_hey_holly_model_id}).set_probability_cutoff(217);
        } else if (x == "Medium") {
          id(${wake_word_hey_holly_model_id}).set_probability_cutoff(176);
        } else if (x == "Medium-High sensitivity") {
          id(${wake_word_hey_holly_model_id}).set_probability_cutoff(110);
        } else if (x == "High sensitivity") {
          id(${wake_word_hey_holly_model_id}).set_probability_cutoff(50);
        }
  - platform: logger
    id: ${logger_select_id}
    name: "Log Level"
    disabled_by_default: true
  - platform: template
    optimistic: true
    name: "Alarm - Action"
    id: ${alarm_action_select_id}
    icon: mdi:bell-plus
    options:
      - "Play sound"
      - "Send event"
      - "Sound and event"
    initial_option: "Play sound"
    on_value:
      then:
        - lambda: |-
            id(${saved_alarm_action_id}) = x;
switch:
  - platform: template
    id: ${security_mode_switch_id}
    name: "Security Mode"
    icon: mdi:shield-home
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(${display_awake_until_id}) = millis() + 300000UL;
          id(${display_startled_until_id}) = 0;
    turn_off_action:
      - lambda: |-
          id(${security_alarm_active_id}) = false;
  - platform: template
    id: ${va_continuous_mode_switch_id}
    name: "Assistant - Continuous Listening"
    icon: mdi:headset
    # Defaults to off: this device has no echo cancellation, so leaving
    # continuous listening on causes it to hear its own TTS output and
    # respond to itself in a feedback loop (see HomeLab doc 9.16).
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(${va_continuous_mode_id});
    turn_on_action:
      - lambda: |-
          id(${va_continuous_mode_id}) = true;
      - logger.log:
          level: INFO
          format: "==== Assistant mode: CONTINUOUS"
    turn_off_action:
      - lambda: |-
          id(${va_continuous_mode_id}) = false;
      - logger.log:
          level: INFO
          format: "==== Assistant mode: SINGLE"
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:
  - platform: gpio
    id: ${amp_enable_switch_id}
    name: "Amplifier"
    icon: mdi:speaker
    entity_category: config
    pin:
      number: ${amp_ctrl}
      inverted: false
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: ${mic_mute_switch_id}
    name: "Microphone Muted"
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - voice_assistant.stop:
      - micro_wake_word.stop:
      - lambda: |-
          id(${audio_adc_id}).set_mic_gain(0.0f);
    turn_off_action:
      - lambda: |-
          id(${audio_adc_id}).set_mic_gain(id(${mic_gain_saved_id}));
      - script.execute: ${script_ensure_wake_word_running_id}
  - platform: template
    id: ${mute_sound_switch_id}
    name: "Mute/Unmute Sound"
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: ${wake_sound_switch_id}
    name: "Wake Word Sound"
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: ${timer_ringing_switch_id}
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - micro_wake_word.disable_model: ${wake_word_stop_model_id}
      - script.execute: ${script_disable_repeat_id}
      - if:
          condition:
            media_player.is_announcing:
              id: ${media_player_id}
          then:
            - media_player.stop:
                id: ${media_player_id}
                announcement: true
      - mixer_speaker.apply_ducking:
          id: ${media_mixer_input_id}
          decibel_reduction: 0
          duration: 1.0s
    on_turn_on:
      - mixer_speaker.apply_ducking:
          id: ${media_mixer_input_id}
          decibel_reduction: 10
          duration: 0s
      - micro_wake_word.enable_model: ${wake_word_stop_model_id}
      - script.execute: ${script_ring_timer_id}
      - delay: 15min
      - switch.turn_off: ${timer_ringing_switch_id}
  - platform: template
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    id: ${alarm_on_switch_id}
    icon: mdi:bell-badge
    name: "Alarm Active"
  - platform: template
    id: ${fw_update_check_switch_id}
    name: "Firmware Update Check"
    icon: mdi:update
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(${fw_update_check_enabled_id});
    turn_on_action:
      - lambda: |-
          id(${fw_update_check_enabled_id}) = true;
      - script.execute: ${script_check_firmware_version_id}
    turn_off_action:
      - lambda: |-
          id(${fw_update_check_enabled_id}) = false;
          id(${fw_update_available_id}) = false;
          id(${fw_latest_version_id}) = "unknown";
number:
  - platform: template
    id: ${noise_threshold_number_id}
    name: "Noise Threshold"
    icon: mdi:waveform
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: -75
    max_value: -25
