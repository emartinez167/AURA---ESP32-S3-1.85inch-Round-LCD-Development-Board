sensor:
  # Battery voltage, read via the onboard BAT_ADC divider (GPIO8, 200K/100K
  # -> raw ADC reading needs x3 to recover actual battery voltage).
  - platform: adc
    pin: ${battery_adc_pin}
    id: aura_battery_voltage
    name: "Battery Voltage"
    update_interval: 60s
    attenuation: 12dB
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - multiply: 3.0
  # Approximate charge percentage from voltage, via a 1S LiPo discharge
  # curve (not linear - LiPo voltage sags non-uniformly with charge level).
  - platform: template
    id: aura_battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      float v = id(aura_battery_voltage).state;
      if (std::isnan(v)) return {};
      struct Point { float volt; float pct; };
      static const Point curve[] = {
        {4.20f, 100.0f}, {4.15f, 95.0f}, {4.11f, 90.0f}, {4.08f, 85.0f},
        {4.02f, 80.0f}, {3.98f, 75.0f}, {3.95f, 70.0f}, {3.91f, 65.0f},
        {3.87f, 60.0f}, {3.85f, 55.0f}, {3.84f, 50.0f}, {3.82f, 45.0f},
        {3.80f, 40.0f}, {3.79f, 35.0f}, {3.77f, 30.0f}, {3.75f, 25.0f},
        {3.73f, 20.0f}, {3.71f, 15.0f}, {3.69f, 10.0f}, {3.61f,  5.0f},
        {3.27f,  0.0f},
      };
      const int n = sizeof(curve) / sizeof(curve[0]);
      if (v >= curve[0].volt) return 100.0f;
      if (v <= curve[n - 1].volt) return 0.0f;
      for (int i = 0; i < n - 1; i++) {
        if (v <= curve[i].volt && v >= curve[i + 1].volt) {
          float ratio = (v - curve[i + 1].volt) / (curve[i].volt - curve[i + 1].volt);
          return curve[i + 1].pct + ratio * (curve[i].pct - curve[i + 1].pct);
        }
      }
      return 0.0f;
    on_value:
      - lvgl.label.update:
          id: aura_battery_label
          text: !lambda |-
            char buf[24];
            snprintf(buf, sizeof(buf), "Battery %.0f%%", x);
            return std::string(buf);
  - platform: template
    id: ${ambient_noise_sensor_id}
    icon: mdi:microphone
    unit_of_measurement: dB
    accuracy_decimals: 1
    update_interval: 200ms
    internal: true
    lambda: |-
      if (std::isnan(id(${playback_peak_sensor_id}).state)) return NAN;
      return id(${playback_peak_sensor_id}).state;
  - platform: sound_level
    id: ${playback_meter_sensor_id}
    microphone:
      microphone: ${microphone_id}
      channels: [0]
    passive: false
    measurement_duration: 150ms
    rms:
      id: ${playback_rms_sensor_id}
      internal: true
    peak:
      id: ${playback_peak_sensor_id}
      internal: true
  - platform: template
    id: ${next_timer_sensor_id}
    name: "Next Timer"
    update_interval: never
    disabled_by_default: true
    device_class: duration
    unit_of_measurement: s
    icon: "mdi:timer"
    accuracy_decimals: 0
text_sensor:
  - platform: template
    id: ${next_timer_name_sensor_id}
