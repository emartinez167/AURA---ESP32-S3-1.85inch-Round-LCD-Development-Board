                              - lvgl.arc.update:
                                  id: aura_outer_arc_1
                                  arc_color: 0x00E5FF
                              - lvgl.arc.update:
                                  id: aura_outer_arc_2
                                  arc_color: 0x00E5FF
                              - lvgl.arc.update:
                                  id: aura_outer_arc_3
                                  arc_color: 0x00E5FF
                              - lvgl.arc.update:
                                  id: aura_outer_arc_4
                                  arc_color: 0x00E5FF
                        - if:
                            condition:
                              lambda: return id(${voice_assistant_phase_global_id}) == ${voice_assist_listening_for_command_phase_id};
                            then:
                              - lvgl.image.update:
                                  id: aura_main_image
                                  src: aura_face_up_img
                              - lvgl.label.update:
                                  id: aura_status_label
                                  text: "I'M LISTENING"
                                  text_color: 0xC8FFE0
                              - lvgl.arc.update:
                                  id: aura_outer_arc_1
                                  arc_color: 0x22C55E
                              - lvgl.arc.update:
                                  id: aura_outer_arc_2
                                  arc_color: 0x22C55E
                              - lvgl.arc.update:
                                  id: aura_outer_arc_3
                                  arc_color: 0x22C55E
                              - lvgl.arc.update:
                                  id: aura_outer_arc_4
                                  arc_color: 0x22C55E
                        - if:
                            condition:
                              lambda: return id(${voice_assistant_phase_global_id}) == ${voice_assist_thinking_phase_id};
                            then:
                              - lvgl.image.update:
                                  id: aura_main_image
                                  src: aura_up_eyes_img
                              - lvgl.label.update:
                                  id: aura_status_label
                                  text: "THINKING"
                                  text_color: 0xE9D5FF
                              - lvgl.arc.update:
                                  id: aura_outer_arc_1
                                  arc_color: 0xA855F7
                              - lvgl.arc.update:
                                  id: aura_outer_arc_2
                                  arc_color: 0xA855F7
                              - lvgl.arc.update:
                                  id: aura_outer_arc_3
                                  arc_color: 0xA855F7
                              - lvgl.arc.update:
                                  id: aura_outer_arc_4
                                  arc_color: 0xA855F7
                        - if:
                            condition:
                              lambda: return id(${voice_assistant_phase_global_id}) == ${voice_assist_error_phase_id};
                            then:
                              - lvgl.image.update:
