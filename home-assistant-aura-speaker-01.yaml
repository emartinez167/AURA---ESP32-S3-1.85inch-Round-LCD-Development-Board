                  width: 14
                  height: 14
                  radius: 7
                  bg_color: 0xA8D8FF
                  bg_opa: COVER
                  border_width: 0
                  clickable: false
                  scrollable: false
              - obj:
                  id: aura_boot_dot_inner
                  x: !lambda return id(aura_boot_dot_inner_x) - 6;
                  y: !lambda return id(aura_boot_dot_inner_y) - 6;
                  width: 12
                  height: 12
                  radius: 6
                  bg_color: 0xFFFFFF
                  bg_opa: COVER
                  border_width: 0
                  clickable: false
                  scrollable: false
              - label:
                  id: aura_boot_title
                  x: 0
                  y: 138
                  width: 360
                  text: "HackMyHome"
                  text_align: CENTER
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  clickable: false
              - label:
                  x: 0
                  y: 188
                  width: 360
                  text: "starting up..."
                  text_align: CENTER
                  text_font: montserrat_14
                  text_color: 0xD8F4FF
                  bg_opa: TRANSP
                  clickable: false
              # Progress bar at about 3/4 of the diameter.
              # Advances in 18 steps: Wi-Fi, HA, and 16 downloads.
              - bar:
                  id: aura_boot_progress_bar
                  x: 60
                  y: 264
                  width: 240
                  height: 12
                  min_value: 0
                  max_value: 18
                  value: 0
                  radius: 6
                  bg_color: 0x27131A
                  bg_opa: COVER
                  border_width: 1
                  border_color: 0x51303A
                  indicator:
                    bg_color: 0xFF2020
                    bg_opa: COVER
