# ======================================================
# LVGL UI
# ======================================================
lvgl:
  id: aura_lvgl
  displays:
    - ${display_id}
  touchscreens:
    - touchscreen_id: ${touch_panel_id}
  log_level: WARN
  color_depth: 16
  buffer_size: 100%
  rotation: 180
  pages:
    # --------------------------------------------------
    # BOOT PAGE - LVGL structure from the source
    # --------------------------------------------------
    - id: aura_boot_page
      bg_color: 0x05081C
      bg_opa: COVER
      widgets:
        - obj:
            id: aura_boot_layer
            x: 0
            y: 0
            width: 360
            height: 360
            radius: 0
            bg_color: 0x05081C
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            clickable: false
            scrollable: false
            widgets:
              - obj:
                  id: aura_boot_glow_outer
                  x: 22
                  y: 22
                  width: 316
                  height: 316
                  radius: 158
                  bg_color: 0x0A2A66
                  bg_opa: 60%
                  border_width: 0
                  clickable: false
                  scrollable: false
              - obj:
                  id: aura_boot_glow_inner
                  x: 74
                  y: 74
                  width: 212
                  height: 212
                  radius: 106
                  bg_color: 0x081A42
                  bg_opa: 75%
                  border_width: 0
                  clickable: false
                  scrollable: false
              - obj:
                  id: aura_boot_ring_outer
                  x: 30
                  y: 30
                  width: 300
                  height: 300
                  radius: 150
                  bg_opa: TRANSP
                  border_width: 3
                  border_color: 0x2B7CFF
                  clickable: false
                  scrollable: false
              - obj:
                  id: aura_boot_ring_mid
                  x: 64
                  y: 64
                  width: 232
                  height: 232
                  radius: 116
                  bg_opa: TRANSP
                  border_width: 3
                  border_color: 0x36B7FF
                  clickable: false
                  scrollable: false
              - obj:
                  id: aura_boot_ring_inner
                  x: 99
                  y: 99
                  width: 162
                  height: 162
                  radius: 81
                  bg_opa: TRANSP
                  border_width: 2
                  border_color: 0xD8F4FF
                  clickable: false
                  scrollable: false
              - obj:
                  id: aura_boot_dot_outer
                  x: !lambda return id(aura_boot_dot_outer_x) - 8;
                  y: !lambda return id(aura_boot_dot_outer_y) - 8;
                  width: 16
                  height: 16
                  radius: 8
                  bg_color: 0x36B7FF
                  bg_opa: COVER
                  border_width: 0
                  clickable: false
                  scrollable: false
              - obj:
                  id: aura_boot_dot_mid
                  x: !lambda return id(aura_boot_dot_mid_x) - 7;
