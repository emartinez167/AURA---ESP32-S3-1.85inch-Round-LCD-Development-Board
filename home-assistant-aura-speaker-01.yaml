                              - lvgl.label.update:
                                  id: aura_status_label
                                  text: "ERROR"
                                  text_color: 0xFFD1D1
                              - lvgl.arc.update:
                                  id: aura_outer_arc_1
                                  arc_color: 0xEF4444
                              - lvgl.arc.update:
                                  id: aura_outer_arc_2
                                  arc_color: 0xEF4444
                              - lvgl.arc.update:
                                  id: aura_outer_arc_3
                                  arc_color: 0xEF4444
                              - lvgl.arc.update:
                                  id: aura_outer_arc_4
                                  arc_color: 0xEF4444
                        - if:
                            condition:
                              lambda: return id(${voice_assistant_phase_global_id}) == ${voice_assist_not_ready_phase_id};
                            then:
                              - lvgl.image.update:
                                  id: aura_main_image
                                  src: aura_idle_standby_img
                              - lvgl.label.update:
                                  id: aura_status_label
                                  text: "NOT CONNECTED"
                                  text_color: 0xCBD5E1
                              - lvgl.arc.update:
                                  id: aura_outer_arc_1
                                  arc_color: 0x64748B
                              - lvgl.arc.update:
                                  id: aura_outer_arc_2
                                  arc_color: 0x64748B
                              - lvgl.arc.update:
                                  id: aura_outer_arc_3
                                  arc_color: 0x64748B
                              - lvgl.arc.update:
                                  id: aura_outer_arc_4
                                  arc_color: 0x64748B
                        - if:
                            condition:
                              lambda: return id(${voice_assistant_phase_global_id}) == ${voice_assist_idle_phase_id};
                            then:
