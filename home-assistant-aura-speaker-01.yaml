                        - lvgl.arc.update:
                            id: aura_outer_arc_1
                            arc_color: 0xFF4FD8
                        - lvgl.arc.update:
                            id: aura_outer_arc_2
                            arc_color: 0xFF4FD8
                        - lvgl.arc.update:
                            id: aura_outer_arc_3
                            arc_color: 0xFF4FD8
                        - lvgl.arc.update:
                            id: aura_outer_arc_4
                            arc_color: 0xFF4FD8
                        - script.execute: aura_start_speaking
                      else:
                        - script.execute: aura_stop_speaking
                        - script.stop: aura_blink
                        - script.stop: aura_random_idle_animation
