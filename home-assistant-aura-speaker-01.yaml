              - label:
                  id: aura_boot_status
                  x: 20
                  y: 306
                  width: 320
                  text: "Connecting to Wi-Fi..."
                  text_align: CENTER
                  text_font: montserrat_14
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  clickable: false
    # --------------------------------------------------
    # AURA - MAIN PAGE
    # --------------------------------------------------
    - id: aura_page
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - lambda: |-
            id(control_page_active) = false;
            id(radio_page_active) = false;
            id(control_page_until) = 0;
      on_swipe_up:
        - script.execute: aura_show_control_page
      on_swipe_right:
        - script.execute: aura_show_radio_page
      widgets:
        # All 16 avatar images are decoded at 204x204 instead of 240x240
        # (see the online_image resize: settings below) so the battery/
        # status area above and the clock/timer area below both get real
        # breathing room. Repositioned to x:78,y:78 to keep the smaller
        # image centered on the 360x360 screen ((360-204)/2 = 78). This
        # resizes the actual decoded pixels rather than using LVGL's
        # runtime image scale, which this board's LVGL build can't do
        # (missing software-transform color format support - corrupted
        # the display when tried).
        - image:
            id: aura_main_image
            x: 78
            y: 78
            src: aura_idle_standby_img
            clickable: false
        # Dark veil during sleep: Aura stays visible but the scene calms down.
        - obj:
            id: aura_sleep_dim
            x: 0
            y: 0
            width: 360
            height: 360
            radius: 0
            bg_color: 0x02040C
            bg_opa: 32%
            border_width: 0
            clickable: false
            scrollable: false
            hidden: true
        # Four rotating arcs: also indicate the VA phase.
        - arc:
            id: aura_outer_arc_1
            x: 5
            y: 5
            width: 350
            height: 350
            start_angle: 0
            end_angle: 28
            rotation: 0
            arc_width: 5
            arc_color: 0x00E5FF
            arc_opa: 90%
            bg_opa: TRANSP
            border_width: 0
            clickable: false
            adjustable: false
            knob:
              bg_opa: TRANSP
        - arc:
            id: aura_outer_arc_2
            x: 5
            y: 5
            width: 350
            height: 350
            start_angle: 90
            end_angle: 118
