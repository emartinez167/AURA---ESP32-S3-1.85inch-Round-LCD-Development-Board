                                  id: aura_status_label
                                  text: "AURA"
                                  text_color: 0xDDF8FF
                              - lvgl.arc.update:
                                  id: aura_outer_arc_1
                                  arc_color: 0x00E5FF
                              - lvgl.arc.update:
                                  id: aura_outer_arc_2
                                  arc_color: 0x00E5FF
                              - lvgl.arc.update:
