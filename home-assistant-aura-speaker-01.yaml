            start_angle: 270
            end_angle: 298
            rotation: 0
            arc_width: 5
            arc_color: 0x00E5FF
            arc_opa: 90%
            bg_opa: TRANSP
            border_width: 0
            clickable: false
            adjustable: false
            knob:
              bg_opa: TRANSP
        # Circular VU meter for music mode.
        # Reuses the old 118-242 degree side arc.
        - arc:
            id: aura_music_vu_arc
            x: 14
            y: 14
            width: 332
            height: 332
            min_value: 0
            max_value: 100
            value: 0
            start_angle: 118
            end_angle: 242
            adjustable: false
            arc_width: 10
            arc_color: 0x182448
            arc_opa: COVER
            bg_opa: TRANSP
            border_width: 0
            indicator:
              arc_width: 10
              arc_color: 0x00DC78
              arc_opa: COVER
            knob:
              bg_opa: TRANSP
            clickable: false
            hidden: true
        # Music notes built with native LVGL objects.
        # Each note is a movable container with a head, stem, and flag.
        - obj:
            id: aura_music_note_1
            x: !lambda |-
              const float level = id(aura_music_level);
              const uint32_t cycle = (uint32_t)(3300.0f / (1.0f + level * 0.45f));
              const float p = ((millis() + 0UL) % cycle) / (float) cycle;
              return 26 + (int)(sinf(p * 6.2831853f) * (5.0f + level * 8.0f));
